<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <!--! Basic Tags -->
    <h1>Hello World</h1>
    <h2>Hello World</h2>
    <h3>Hello World</h3>
    <h6>Hello World</h6>

    <!--! TEXT FORMATTING TAGS  -->
    <b>bold</b>
    <strong>strong</strong>
    <i>italics</i>
    <em>emphasis</em>
    <u>underline</u>
    <ins>ins</ins>
    <strike>strike</strike>
    <del>del</del>
    <mark>mark</mark>
    <sup>2</sup>
    <sub>2</sub>

    <!-- ! FOR ADVERTISMENT PURPOSE -->
    <!-- 
    behavior="scroll / alternate / slide"
    scrollamount="10"
    direction="right / left"
     -->
    <marquee behavior="scroll" direction="right" scrollamount="50">
      Hello Everyone
    </marquee>

    <!-- 
    ! ELEMENTS : combination of opening and closing tag with content
    ex :- <h1>Text</h1>

    ! THERE THE 3 TYPES OF ELEMENTS
    1) Block elements
    - it takes full width of viewport
    - it accepts height and width property
    - ex:- heading tags, p, div, form, table ...

    2) Inline elements
    - it takes only content width
    - it do not accepts height and width property
    - ex:- strong, em, ins, del, span

    3) Inline-Block elements
    - it takes only content width
    - it accepts height and width property
    - ex:- img, iframe, video ....
    -->


    <div style="background-color: lightblue; height: 100px;">
        BLOCK ELEMENT
    </div>


    <span style="background-color: lightpink; height: 100px;">
        INLINE ELEMENT
    </span>


    <!-- 
    ! PATHS ARE OF 2 TYPES
    1) Absolute :- https://.......
    2) Relative :-   ./  ,  ../  , /
    
    -->

    <!-- Relative Path  -->
    <img src="../img1.png" alt="john doe" height="200" width="200">

    <!-- Absolute Path -->
    <img src="https://www.shutterstock.com/image-photo/car-running-on-road-city-260nw-2647951177.jpg" alt="john doe" height="200" width="200">






  </body>
</html>
