<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      input::placeholder {
        color: red;
      }
      h1::selection {
        background-color: crimson;
        color: whitesmoke;
      }
      h2::after {
        content: "📚";
      }
      h2::before {
        content: "👉🏼";
      }
      ol > li::marker {
        color: royalblue;
      }
      p::first-letter{
        color: red;
      }
      p::first-line{
        color: yellow;
      }

      



    </style>
  </head>
  <body>
    <h1>Learn Pseudo Element Selectors ::</h1>
    <input type="text" placeholder="Hello World" />
    <h2>Frontend Course</h2>
    <ol>
      <li>HTML</li>
      <li>CSS</li>
      <li>JS</li>
    </ol>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Magni vel tempore facere cupiditate sequi ipsum nulla hic optio blanditiis distinctio, esse, sint aliquam eveniet similique autem vero sit qui asperiores.</p>
  </body>
</html>
