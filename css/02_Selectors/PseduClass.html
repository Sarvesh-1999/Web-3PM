<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      button {
        transition: 0.5s;
      }
      button:hover {
        background-color: black;
        color: white;
        transform: scale(1.5);
      }
      button:active {
        background-color: royalblue;
      }
      a:link {
        color: greenyellow;
      }
      a:visited {
        color: aqua;
      }
      a:active {
        color: blue;
      }
    </style>
  </head>
  <body>
    <h1>Learn Pseudo-class Selectors :</h1>
    <button>Submit</button>
    <br />
    <a href="https://www.ajio.com">
        ajio
    </a>
    <a href="https://www.myntra.com">
        myntra
    </a>
  </body>
</html>
