<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .box1 {
        height: 200px;
        width: 200px;
        background-color: yellow;
        border: 10px solid black;
        padding: -80px;
        margin: 40px;
      }
      .box2 {
        height: 200px;
        width: 200px;
        padding: 80px;
        border: 5px solid black;
        background-color: lightgreen;
        margin-left: -100px;
      }
    </style>
  </head>
  <body>
    <h1>Learn Box Model</h1>

    <!-- 
    ! THERE ARE 4 COMPONENTS IN BOX MODEL
    1) CONTENT : space occupied by data
    2) PADDING : space between data and the border
    3) BORDER : outline on the element
    4) MARGIN : space around an element
    -->

    <div class="box1">Box 1</div>
    <div class="box2">Box 2</div>
  </body>
</html>
