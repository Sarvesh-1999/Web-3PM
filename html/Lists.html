<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>
<body>
    <h1>Learn Lists in HTML</h1>

    <!-- ORDERED LIST -->
    <ol type="1" start="27" reversed>
        <li>Frontend</li>
        <li>Middleware</li>
        <li>Database</li>
    </ol>

    <!-- UNORDERED LIST -->
    <ul type="circle">
        <li>Frontend</li>
        <li>Middleware</li>
        <li>Database</li>
    </ul>

    <!-- DESCRIPTION/DEFINATION LIST -->
     <dl>
        <dt>descriptionTerm</dt>
        <dd>description Defination/Data</dd>
     </dl>
    
</body>
</html>
